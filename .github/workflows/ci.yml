name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace boundaries
        run: pnpm check:workspace

      - name: Check generated OpenAPI documents
        run: pnpm check:openapi

      - name: Check repository task ledger
        run: pnpm check:tasks

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test packages
        run: pnpm -r test

      - name: Build deployment bundle
        run: pnpm --filter @unicas/service-cloudflare exec wrangler deploy --dry-run