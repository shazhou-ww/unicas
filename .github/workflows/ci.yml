name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      spaces_action:
        description: Spaces production operation
        required: true
        default: none
        type: choice
        options:
          - none
          - provision-deploy
          - principals

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run exhaustive test suite
        run: pnpm test:exhaustive

      - name: Check published repository task ledger
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm check:tasks --remote

      - name: Build
        run: pnpm build

      - name: Build documentation site
        run: pnpm docs:build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build deployment bundle
        run: pnpm --filter @unicas/service-cloudflare exec wrangler deploy --dry-run

      - name: Build Spaces deployment bundle
        run: pnpm deploy:spaces:plan

      - name: Build product-site deployment bundle
        run: pnpm deploy:site:plan

      - name: Build documentation deployment bundle
        run: pnpm deploy:docs:plan

  bootstrap-spaces:
    name: Bootstrap Spaces
    if: >-
      github.ref == 'refs/heads/release' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.spaces_action != 'none'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: Production
    concurrency:
      group: unicas-production
      cancel-in-progress: false
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify validated revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Provision Spaces D1
        if: inputs.spaces_action == 'provision-deploy'
        id: spaces-d1
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_DATABASE_ID: ${{ vars.SPACES_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          list_databases() {
            pnpm --filter @unicas/service-cloudflare exec wrangler d1 list --json
          }
          database_id="$(D1_JSON="$(list_databases)" node -e 'const rows=JSON.parse(process.env.D1_JSON); const row=rows.find((item)=>item.name==="unicas-spaces"); process.stdout.write(row?.uuid ?? "")')"
          if [[ -z "$database_id" ]]; then
            pnpm --filter @unicas/service-cloudflare exec wrangler d1 create unicas-spaces --location enam
            database_id="$(D1_JSON="$(list_databases)" node -e 'const rows=JSON.parse(process.env.D1_JSON); const row=rows.find((item)=>item.name==="unicas-spaces"); process.stdout.write(row?.uuid ?? "")')"
          fi
          if [[ ! "$database_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::Could not resolve the unicas-spaces D1 database ID"
            exit 1
          fi
          if [[ -n "${CONFIGURED_DATABASE_ID:-}" && "$CONFIGURED_DATABASE_ID" != "$database_id" ]]; then
            echo "::error::Configured Spaces D1 ID does not match the named database"
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "::notice title=Spaces D1::SPACES_D1_DATABASE_ID=$database_id"

      - name: Deploy Spaces issuer bootstrap
        if: inputs.spaces_action == 'provision-deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SPACES_BOOTSTRAP_DEPLOY_CONFIRM: spaces.unicas.work
          SPACES_D1_DATABASE_ID: ${{ steps.spaces-d1.outputs.database_id }}
          SPACES_SIGNING_KID: ${{ vars.SPACES_SIGNING_KID }}
          SPACES_SIGNING_PRIVATE_KEY_PKCS8: ${{ secrets.SPACES_SIGNING_PRIVATE_KEY_PKCS8 }}
          SPACES_SIGNING_PUBLIC_JWKS: ${{ vars.SPACES_SIGNING_PUBLIC_JWKS }}
          SPACES_SMOKE_CREDENTIAL: ${{ secrets.SPACES_SMOKE_CREDENTIAL }}
          SPACES_SMOKE_PRINCIPAL_ID: ${{ vars.SPACES_SMOKE_PRINCIPAL_ID }}
          SPACES_UNICAS_AUDIENCE: ${{ vars.SPACES_UNICAS_AUDIENCE }}
        run: pnpm deploy:spaces:bootstrap

      - name: Materialize Spaces signing key
        if: inputs.spaces_action == 'principals'
        shell: bash
        env:
          SPACES_SIGNING_PRIVATE_KEY_PKCS8: ${{ secrets.SPACES_SIGNING_PRIVATE_KEY_PKCS8 }}
        run: |
          set -euo pipefail
          install -d -m 700 .wrangler/spaces
          umask 077
          printf '%s\n' "$SPACES_SIGNING_PRIVATE_KEY_PKCS8" > .wrangler/spaces/bootstrap-key.pem
          chmod 600 .wrangler/spaces/bootstrap-key.pem

      - name: Bootstrap Spaces Principals
        if: inputs.spaces_action == 'principals'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SPACES_BOOTSTRAP_APP_ID: ${{ vars.SPACES_BOOTSTRAP_APP_ID }}
          SPACES_BOOTSTRAP_GOOGLE_SUBJECT: ${{ secrets.SPACES_GOOGLE_SUBJECT }}
          SPACES_BOOTSTRAP_KEY_FILE: .wrangler/spaces/bootstrap-key.pem
          SPACES_D1_DATABASE_ID: ${{ vars.SPACES_D1_DATABASE_ID }}
          SPACES_GOOGLE_CLIENT_ID: bootstrap-disabled
          SPACES_SIGNING_KID: ${{ vars.SPACES_SIGNING_KID }}
          SPACES_SIGNING_PUBLIC_JWKS: ${{ vars.SPACES_SIGNING_PUBLIC_JWKS }}
          SPACES_SMOKE_PRINCIPAL_ID: ${{ vars.SPACES_SMOKE_PRINCIPAL_ID }}
          SPACES_UNICAS_AUDIENCE: ${{ vars.SPACES_UNICAS_AUDIENCE }}
          SPACES_USER_DISPLAY_NAME: ${{ vars.SPACES_USER_DISPLAY_NAME }}
          SPACES_USER_PRINCIPAL_ID: ${{ vars.SPACES_USER_PRINCIPAL_ID }}
          SPACES_USER_SPACE_ID: ${{ vars.SPACES_USER_SPACE_ID }}
          SPACES_SMOKE_SPACE_ID: ${{ vars.SPACES_SMOKE_SPACE_ID }}
        run: |
          set -euo pipefail
          SPACES_BOOTSTRAP_SPACE_ID="$SPACES_USER_SPACE_ID" \
          SPACES_BOOTSTRAP_PRINCIPAL_ID="$SPACES_USER_PRINCIPAL_ID" \
          SPACES_BOOTSTRAP_DISPLAY_NAME="$SPACES_USER_DISPLAY_NAME" \
          SPACES_BOOTSTRAP_REF_DOMAIN="spaces:files" \
            pnpm spaces:bootstrap -- --mode google
          SPACES_BOOTSTRAP_SPACE_ID="$SPACES_SMOKE_SPACE_ID" \
          SPACES_BOOTSTRAP_PRINCIPAL_ID="$SPACES_SMOKE_PRINCIPAL_ID" \
          SPACES_BOOTSTRAP_DISPLAY_NAME="Release smoke" \
          SPACES_BOOTSTRAP_REF_DOMAIN="spaces:smoke" \
            pnpm spaces:bootstrap -- --mode smoke

      - name: Remove Spaces bootstrap key
        if: ${{ always() && inputs.spaces_action == 'principals' }}
        run: rm -f -- .wrangler/spaces/bootstrap-key.pem

  deploy-production:
    name: Deploy production
    if: >-
      github.ref == 'refs/heads/release' &&
      vars.SPACES_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.spaces_action == 'none'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: Production
    concurrency:
      group: unicas-production
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify validated revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Synchronize production provider secrets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CAS_R2_ACCESS_KEY_ID: ${{ secrets.CAS_R2_ACCESS_KEY_ID }}
          CAS_R2_SECRET_ACCESS_KEY: ${{ secrets.CAS_R2_SECRET_ACCESS_KEY }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_MICROSOFT_CLIENT_SECRET: ${{ secrets.OAUTH_MICROSOFT_CLIENT_SECRET }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in CAS_R2_ACCESS_KEY_ID CAS_R2_SECRET_ACCESS_KEY OAUTH_GOOGLE_CLIENT_SECRET OAUTH_MICROSOFT_CLIENT_SECRET OAUTH_GITHUB_CLIENT_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in the Production environment"
              exit 1
            fi
            printf '%s' "${!name}" | pnpm --filter @unicas/service-cloudflare exec wrangler secret put "$name"
          done

      - name: Materialize production smoke signing key
        shell: bash
        env:
          UNICAS_SMOKE_PRIVATE_KEY_PKCS8: ${{ secrets.UNICAS_SMOKE_PRIVATE_KEY_PKCS8 }}
        run: |
          set -euo pipefail
          if [[ -z "$UNICAS_SMOKE_PRIVATE_KEY_PKCS8" ]]; then
            echo "::error::UNICAS_SMOKE_PRIVATE_KEY_PKCS8 is not configured in the production environment"
            exit 1
          fi
          install -d -m 700 .wrangler/cas-deploy
          umask 077
          printf '%s\n' "$UNICAS_SMOKE_PRIVATE_KEY_PKCS8" > .wrangler/cas-deploy/github-actions-smoke-key.pem
          chmod 600 .wrangler/cas-deploy/github-actions-smoke-key.pem

      - name: Deploy API and Console for App/Space v1 issuer cutover
        if: vars.APP_SPACE_V1_CUTOVER_ENABLED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_MICROSOFT_CLIENT_ID: ${{ vars.OAUTH_MICROSOFT_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
        run: |
          node stacks/unicas/deploy/ensure-encryption-secrets.mjs
          pnpm --filter @unicas/service-cloudflare build
          pnpm --filter @unicas/service-cloudflare exec wrangler deploy \
            --var "OAUTH_GOOGLE_CLIENT_ID:$OAUTH_GOOGLE_CLIENT_ID" \
            --var "OAUTH_MICROSOFT_CLIENT_ID:$OAUTH_MICROSOFT_CLIENT_ID" \
            --var "OAUTH_GITHUB_CLIENT_ID:$OAUTH_GITHUB_CLIENT_ID"

      - name: Cut over App/Space v1 issuer audiences
        if: vars.APP_SPACE_V1_CUTOVER_ENABLED == 'true'
        env:
          UNICAS_RELEASE_ADMIN_SESSION: ${{ secrets.UNICAS_RELEASE_ADMIN_SESSION }}
          UNICAS_SMOKE_APP_ID: ${{ vars.UNICAS_SMOKE_APP_ID }}
          UNICAS_SMOKE_ISSUER: ${{ vars.UNICAS_SMOKE_ISSUER }}
          UNICAS_SMOKE_KID: ${{ vars.UNICAS_SMOKE_KID }}
          UNICAS_SMOKE_PRIVATE_KEY_PKCS8: ${{ secrets.UNICAS_SMOKE_PRIVATE_KEY_PKCS8 }}
          SPACES_BOOTSTRAP_APP_ID: ${{ vars.SPACES_BOOTSTRAP_APP_ID }}
          SPACES_SIGNING_KID: ${{ vars.SPACES_SIGNING_KID }}
          SPACES_SIGNING_PRIVATE_KEY_PKCS8: ${{ secrets.SPACES_SIGNING_PRIVATE_KEY_PKCS8 }}
        run: pnpm exec tsx stacks/unicas/deploy/cut-over-app-space-v1-issuers.mjs

      - name: Deploy API and console service, then run canonical smoke
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_MICROSOFT_CLIENT_ID: ${{ vars.OAUTH_MICROSOFT_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          UNICAS_SMOKE_APP_ID: ${{ vars.UNICAS_SMOKE_APP_ID }}
          UNICAS_SMOKE_ISSUER: ${{ vars.UNICAS_SMOKE_ISSUER }}
          UNICAS_SMOKE_AUDIENCE: ${{ vars.UNICAS_SMOKE_AUDIENCE }}
          UNICAS_SMOKE_KID: ${{ vars.UNICAS_SMOKE_KID }}
          UNICAS_SMOKE_SPACE_ID: ${{ vars.UNICAS_SMOKE_SPACE_ID }}
          UNICAS_SMOKE_KEY_FILE: github-actions-smoke-key.pem
        run: pnpm deploy:production

      - name: Remove production smoke signing key
        if: ${{ always() }}
        run: rm -f -- .wrangler/cas-deploy/github-actions-smoke-key.pem

      - name: Deploy Spaces App and run release smoke
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SPACES_D1_DATABASE_ID: ${{ vars.SPACES_D1_DATABASE_ID }}
          SPACES_GOOGLE_CLIENT_ID: ${{ vars.SPACES_GOOGLE_CLIENT_ID }}
          SPACES_GOOGLE_CLIENT_SECRET: ${{ secrets.SPACES_GOOGLE_CLIENT_SECRET }}
          SPACES_SIGNING_KID: ${{ vars.SPACES_SIGNING_KID }}
          SPACES_SIGNING_PRIVATE_KEY_PKCS8: ${{ secrets.SPACES_SIGNING_PRIVATE_KEY_PKCS8 }}
          SPACES_SIGNING_PUBLIC_JWKS: ${{ vars.SPACES_SIGNING_PUBLIC_JWKS }}
          SPACES_SMOKE_CREDENTIAL: ${{ secrets.SPACES_SMOKE_CREDENTIAL }}
          SPACES_SMOKE_PRINCIPAL_ID: ${{ vars.SPACES_SMOKE_PRINCIPAL_ID }}
          SPACES_UNICAS_AUDIENCE: ${{ vars.SPACES_UNICAS_AUDIENCE }}
        run: pnpm deploy:spaces

      - name: Deploy product site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:site

      - name: Deploy documentation site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:docs

      - name: Verify API origin
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 --proto '=https' --output "$body" --write-out '%{http_code}' https://api.unicas.work/health)"
          if [[ "$status" != "200" ]]; then
            echo "::error::API origin returned HTTP $status; expected 200"
            exit 1
          fi
          if ! grep --fixed-strings --quiet '"ok":true' "$body" || ! grep --fixed-strings --quiet '"service":"unicas"' "$body"; then
            echo "::error::API health response did not identify the UniCAS service"
            exit 1
          fi

      - name: Verify console origin
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 --proto '=https' --max-redirs 0 --output /dev/null --write-out '%{http_code} %{redirect_url}' https://console.unicas.work/)"
          if [[ "$result" != "302 https://console.unicas.work/admin/" ]]; then
            echo "::error::Console origin returned '$result'; expected its HTTPS /admin/ redirect"
            exit 1
          fi

      - name: Verify Spaces origin
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 --proto '=https' --output "$body" --write-out '%{http_code}' https://spaces.unicas.work/)"
          if [[ "$status" != "200" ]]; then
            echo "::error::Spaces origin returned HTTP $status; expected 200"
            exit 1
          fi
          if ! grep --fixed-strings --quiet 'UniCAS Spaces' "$body"; then
            echo "::error::Spaces origin did not return the file App"
            exit 1
          fi

      - name: Verify product origin
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 --proto '=https' --output "$body" --write-out '%{http_code}' https://unicas.work/)"
          if [[ "$status" != "200" ]]; then
            echo "::error::Product origin returned HTTP $status; expected 200"
            exit 1
          fi
          if ! grep --fixed-strings --quiet 'UniCAS | Content-addressed storage infrastructure' "$body"; then
            echo "::error::Product origin did not return the UniCAS site"
            exit 1
          fi

      - name: Verify documentation origin
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 --proto '=https' --output "$body" --write-out '%{http_code}' https://docs.unicas.work/)"
          if [[ "$status" != "200" ]]; then
            echo "::error::Documentation origin returned HTTP $status; expected 200"
            exit 1
          fi
          if ! grep --fixed-strings --quiet 'Overview | UniCAS Docs' "$body"; then
            echo "::error::Documentation origin did not return the UniCAS docs site"
            exit 1
          fi

  tag-production:
    name: Tag verified production deployment
    if: >-
      success() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release'
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Tag verified deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/tag-production-deployment.mjs