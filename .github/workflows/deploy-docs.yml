name: Deploy documentation

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full lowercase commit SHA equal to current main
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: Production
    concurrency:
      group: unicas-production
      queue: max
      cancel-in-progress: false
    steps:
      - name: Validate requested revision
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact authoritative primary revision
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$REVISION"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install documentation browser
        run: pnpm --filter @unicas/docs-site exec playwright install --with-deps chromium

      - name: Validate repository and documentation
        run: |
          pnpm check:ideas:commit
          pnpm --filter @unicas/docs-site test
          pnpm --filter @unicas/docs-site typecheck
          pnpm --filter @unicas/docs-site test:browser

      - name: Review documentation deployment
        env:
          DOCS_SOURCE_REVISION: ${{ inputs.revision }}
        run: pnpm deploy:docs:plan

      - name: Deploy documentation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOCS_SOURCE_REVISION: ${{ inputs.revision }}
        run: pnpm deploy:docs

      - name: Verify documentation routes and source revision
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          for url in \
            https://docs.unicas.work/ \
            https://docs.unicas.work/app-user-api/sdk/ \
            https://docs.unicas.work/app-user-api/quickstart/ \
            https://docs.unicas.work/app-user-api/compatibility/ \
            https://docs.unicas.work/app-user-api/sdk-reference/ \
            https://docs.unicas.work/app-user-api/versioning/ \
            https://docs.unicas.work/app-user-api/changelog/ \
            https://docs.unicas.work/app-user-api/troubleshooting/ \
            https://github.com/shazhou-ww/unicas/blob/main/SUPPORT.md \
            https://github.com/shazhou-ww/unicas/blob/main/SECURITY.md
          do
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 --proto '=https' \
              --output /dev/null "$url"
          done

          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          for attempt in {1..10}; do
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 60 --proto '=https' \
              --output "$manifest" \
              https://docs.unicas.work/artifact-manifest.json
            if MANIFEST="$manifest" REVISION="$REVISION" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile(process.env.MANIFEST, "utf8"));
          if (manifest.sourceRevision !== process.env.REVISION) {
            throw new Error(
              `deployed source revision ${manifest.sourceRevision} differs from ${process.env.REVISION}`,
            );
          }
          NODE
            then
              exit 0
            fi
            if [[ "$attempt" == 10 ]]; then
              echo "::error::Documentation source revision did not converge"
              exit 1
            fi
            sleep 3
          done
