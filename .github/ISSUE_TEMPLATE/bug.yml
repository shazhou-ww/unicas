name: Bug report
description: Report a reproducible UniCAS defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private data, or vulnerability details.
        Report security issues through the private advisory link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest synthetic example and exact commands.
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include UniCAS package versions, Node.js, pnpm, TypeScript, and browser where relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      description: Remove tokens, private identifiers, customer data, and private endpoints.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no secrets or private data.
          required: true
        - label: This is not a suspected security vulnerability.
          required: true
