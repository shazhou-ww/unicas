name = "unicas"
main = "dist/worker.js"
compatibility_date = "2025-08-17"
compatibility_flags = ["global_fetch_strictly_public", "nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.05
invocation_logs = false
persist = true
destinations = []

[observability.traces]
enabled = false
head_sampling_rate = 0
persist = false
destinations = []

[[routes]]
pattern = "api.unicas.work"
custom_domain = true

[[routes]]
pattern = "console.unicas.work"
custom_domain = true

[[d1_databases]]
binding = "CAS_CONTROL_DB"
database_name = "unicas-control"
database_id = "3a64d58d-692c-4340-af22-c4b4f3e923f1"

[[d1_databases]]
binding = "CAS_DB"
database_name = "unicas-tenant"
database_id = "c3924c96-0a9c-479c-b82d-4eb840642bfd"

[[r2_buckets]]
binding = "CAS_R2"
bucket_name = "unicas-content"
preview_bucket_name = "unicas-content-preview"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "105946859be94ca8b0563dd7b45099d0"

[[send_email]]
name = "EMAIL"

[triggers]
crons = ["17 * * * *"]

[durable_objects]
bindings = [
  { name = "CAS_DO", class_name = "CasDurableObject" },
  { name = "CAS_DOMAIN_DO", class_name = "RootRefDomainDurableObject" },
]

[exports.CasDurableObject]
type = "durable-object"
storage = "sqlite"

[exports.RootRefDomainDurableObject]
type = "durable-object"
storage = "sqlite"

[vars]
CAS_ADMIN_MOUNT = "/admin"
CAS_PUBLIC_ORIGIN = "https://api.unicas.work"
MCP_PUBLIC_ORIGIN = "https://api.unicas.work"
ADMIN_PUBLIC_ORIGIN = "https://console.unicas.work"
PUBLIC_ORIGIN = "https://unicas.work"
OAUTH_GOOGLE_CLIENT_ID = "152437813368-hrv07qv06756pg68c4p9f84i8cf4uk00.apps.googleusercontent.com"
MCP_ALLOWED_ORIGIN_HOSTNAMES = ""
MCP_MUTATIONS_ENABLED = "true"
CAS_R2_ACCOUNT_ID = "92c3c4fdcc84a1590555bccf4f111de2"
CAS_R2_BUCKET_NAME = "unicas-content"
CAS_UPLOAD_URL_EXPIRY_SECONDS = "300"
ADMIN_EMAIL_FROM = "no-reply@unicas.work"